{% extends "base.html" %}

{% block title %}Submit a Review | GARG GREEN ENERGY{% endblock %}

{% block content %}

<section class="contact-section">

    <div class="contact-container">

        <div class="contact-header">

            <span class="section-badge">
                CUSTOMER REVIEW
            </span>

            <h1>
                Share Your Experience
            </h1>

            <p>
                We value genuine feedback from our customers.
            </p>

        </div>


        <div class="contact-form-wrapper">

            <form
                method="POST"
                action="{{ url_for('review') }}"
                class="contact-form"
            >

                <div class="form-group">

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="rating">
                        Your Rating
                    </label>

                    <select
                        id="rating"
                        name="rating"
                        required
                    >

                        <option value="">
                            Select rating
                        </option>

                        <option value="5">
                            ★★★★★ — Excellent
                        </option>

                        <option value="4">
                            ★★★★☆ — Very Good
                        </option>

                        <option value="3">
                            ★★★☆☆ — Good
                        </option>

                        <option value="2">
                            ★★☆☆☆ — Fair
                        </option>

                        <option value="1">
                            ★☆☆☆☆ — Poor
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="review">
                        Your Review
                    </label>

                    <textarea
                        id="review"
                        name="review"
                        rows="6"
                        placeholder="Write your experience..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="contact-submit-btn"
                >
                    Submit Review
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
